name: Deploy Walk to Mordor PWA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js & Run Unit Tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Execute Test Suite Gate
        run: npm test

      - name: Inject Google Maps API Key from GitHub Secret
        env:
          GMAPS_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          printf "export const DEFAULT_GMAPS_API_KEY = %s;\n" "$(jq -Rn 'env.GMAPS_KEY // ""')" > ./public/config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
